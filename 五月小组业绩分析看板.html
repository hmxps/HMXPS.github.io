.header .subtitle{font-size:13px;color:#888;margin-top:4px}
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding:24px 32px}
.kpi-card{background:#fff;border:1px solid #eee;border-radius:6px;padding:20px;position:relative}
.kpi-card .label{font-size:13px;color:#888;margin-bottom:8px}

.kpi-card .unit{font-size:14px;font-weight:400;color:#888;margin-left:2px}

.kpi-card .bar{position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0}
.kpi-card .bar.blue{background:#4e79f6}
.kpi-card .bar.green{background:#22c55e}
.kpi-card .bar.orange{background:#f59e0b}
.kpi-card .bar.purple{background:#8b5cf6}
.kpi-card .bar.red{background:#ef4444}
.kpi-card .bar.teal{background:#14b8a6}
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 32px 24px}
.dashboard .full{grid-column:1/-1}
.panel{background:#fff;border:1px solid #eee;border-radius:6px;overflow:hidden}
.panel .panel-header{padding:16px 20px;border-bottom:1px solid #f0f0f0;font-size:14px;font-weight:600;color:#333}
.panel .panel-body{padding:0}
.panel .chart{width:100%;height:360px}
.panel .chart.tall{height:440px}
.table-wrap{overflow-x:auto;padding:0 20px 20px}
table{width:100%;border-collapse:collapse;font-size:13px}
table th{background:#f8f9fa;padding:10px 12px;text-align:left;font-weight:600;color:#555;border-bottom:2px solid #e8e8e8;white-space:nowrap}
table td{padding:10px 12px;border-bottom:1px solid #f0f0f0;color:#444}
table tr:hover td{background:#fafbfc}
table .num{text-align:right;font-variant-numeric:tabular-nums}
table .highlight{color:#4e79f6;font-weight:600}
.rank-badge{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:4px;font-size:12px;font-weight:600;color:#fff}
.rank-badge.r1{background:#f59e0b}
.rank-badge.r2{background:#94a3b8}
.rank-badge.r3{background:#cd7b2e}
.rank-badge.rn{background:#e2e8f0;color:#888}
@media(max-width:1200px){.kpi-row{grid-template-columns:repeat(3,1fr)}.dashboard{grid-template-columns:1fr}}

// Format helpers
const fmtMoney = v => v >= 10000 ? (v/10000).toFixed(1)+'万' : v.toFixed(0);
const fmtNum = v => v >= 10000 ? (v/10000).toFixed(1)+'万' : v.toFixed(0);
const fmtPct = v => parseFloat(v).toFixed(1)+'%';

// KPI Cards
const t = DATA.totals;
const kpis = [
  {label:'总销售额',value:'¥'+fmtMoney(t.销售额),sub:'整体毛利率 '+t.整体毛利率+'%',bar:'blue'},
  {label:'毛利润',value:'¥'+fmtMoney(t.毛利润),sub:'毛利率 '+t.整体毛利率+'%',bar:'green'},
  {label:'总销量',value:fmtNum(t.销量),sub:'共 '+t.产品数+' 个产品',bar:'purple'},
  {label:'广告花费',value:'¥'+fmtMoney(t.广告花费),sub:'ROAS '+t.广告ROAS,bar:'orange'},
  {label:'广告销售额',value:'¥'+fmtMoney(t.广告销售额),sub:'CTR '+t.CTR+'%',bar:'teal'},
  {label:'退款金额',value:'¥'+fmtMoney(t.退款金额),sub:'退款率 '+(t.销售额>0?(t.退款金额/t.销售额*100).toFixed(1):0)+'%',bar:'red'},
];
document.getElementById('kpi-cards').innerHTML = kpis.map(k => 
  `<div class="kpi-card"><div class="bar ${k.bar}"></div><div class="label">${k.label}</div><div class="value">${k.value}</div><div class="sub">${k.sub}</div></div>`
).join('');

// Common chart config
function initChart(id) {
  const c = echarts.init(document.getElementById(id));
  window.addEventListener('resize', () => c.resize());
  return c;
}

// 1. Operator comparison
(function() {
  const ops = DATA.operators.sort((a,b) => b.销售额 - a.销售额);
  const c = initChart('chart-operator');
  c.setOption({
    tooltip: {trigger:'axis',axisPointer:{type:'shadow'}},
    legend: {bottom:0,textStyle:{fontSize:12}},
    grid: {left:70,right:40,top:20,bottom:40},
    xAxis: {type:'category',data:ops.map(o=>o.name),axisLabel:{fontSize:12}},
    yAxis: [{type:'value',name:'销售额',axisLabel:{formatter:v=>v>=10000?(v/10000).toFixed(0)+'万':v}}],
    series: [
      {name:'销售额',type:'bar',data:ops.map(o=>o.销售额),itemStyle:{color:'#4e79f6'},barMaxWidth:40},
      {name:'毛利润',type:'bar',data:ops.map(o=>o.毛利润),itemStyle:{color:'#22c55e'},barMaxWidth:40},
      {name:'广告花费',type:'bar',data:ops.map(o=>o.广告花费),itemStyle:{color:'#f59e0b'},barMaxWidth:40}
    ]
  });
})();

  const ops = DATA.operators;

    tooltip: {

        const d = ops[p.dataIndex];
        return `<b>${d.name}</b><br/>毛利率: ${d.毛利率}%<br/>广告ACOS: ${(d.广告销售额>0?d.广告花费/d.广告销售额*100:0).toFixed(1)}%<br/>销售额: ¥${fmtMoney(d.销售额)}`;
      }
    },
    grid: {left:60,right:30,top:50,bottom:50},
    xAxis: {name:'毛利率(%)',nameLocation:'center',nameGap:30,axisLabel:{formatter:v=>v+'%'}},
    yAxis: {name:'广告ACOS(%)',nameLocation:'center',nameGap:40,axisLabel:{formatter:v=>v+'%'},inverse:true},
    series: [{
      type:'scatter',
      data: ops.map(o => {
        const acos = o.广告销售额 > 0 ? o.广告花费 / o.广告销售额 * 100 : 0;
        return [parseFloat(o.毛利率), parseFloat(acos.toFixed(1)), o.销售额];
      }),
      symbolSize: v => Math.max(20, Math.min(60, v[2] / 20000)),
      itemStyle: {color:'#4e79f6'},
      label: {show:true,formatter:p=>ops[p.dataIndex].name,position:'top',fontSize:11},
      emphasis: {itemStyle:{color:'#f59e0b'}}
    }]
  });
})();

      <tbody>${rows}</tbody>
    </table>`;
})();
